<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Structure Builder — VGL Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0F1E;--cream:#F7F4EE;--gold:#D4922A;--teal:#0C5E5A;--rust:#B84A2E;
  --mist:#E8EFF4;--mid:#6B7A8D;--card:#FFFFFF;--border:#DDE4EC;
  --success:#1B6B4A;--warn:#A05A00;--danger:#9B2020;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}

/* HEADER */
.masthead{background:var(--ink);padding:28px 36px 24px;position:relative;overflow:hidden;}
.masthead::before{content:'';position:absolute;top:-60px;right:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(212,146,42,.15),transparent 70%);}
.mc-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(212,146,42,.12);border:1px solid rgba(212,146,42,.3);border-radius:20px;padding:5px 14px;margin-bottom:14px;}
.mc-badge span{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.tool-num{width:24px;height:24px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink);}
h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#fff;line-height:1.15;max-width:560px;}
h1 em{color:var(--gold);font-style:normal;}
.masthead-sub{font-size:13px;color:rgba(255,255,255,.5);margin-top:8px;font-weight:300;}

/* MAIN */
.main{max-width:900px;margin:0 auto;padding:32px 24px 80px;}

/* CARDS */
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:26px 28px;margin-bottom:20px;box-shadow:0 2px 16px rgba(10,15,30,.06);}
.card-title{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:1px;margin-bottom:18px;display:flex;align-items:center;gap:10px;}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* GRID */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:16px;}

/* FIELDS */
.field label{display:block;font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;}
.field input,.field select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s;}
.field input:focus,.field select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(12,94,90,.08);}

/* COMPUTED */
.computed{background:var(--mist);border:1.5px solid var(--border);border-radius:8px;padding:10px 13px;font-size:14px;font-weight:700;color:var(--ink);min-height:42px;display:flex;align-items:center;transition:background .3s;}
.computed.good{background:#E6F4EE;border-color:#A8D4BC;color:var(--success);}
.computed.warn{background:#FEF6E6;border-color:#E8C97A;color:var(--warn);}
.computed.bad{background:#FDEAEA;border-color:#E8A8A8;color:var(--danger);}

/* CTA BUTTON */
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#fff;border:none;padding:13px 28px;border-radius:9px;font-family:'Syne',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;transition:background .2s,transform .1s;}
.cta:hover{background:#0A4E4A;transform:translateY(-1px);}
.cta-ghost{background:transparent;border:1.5px solid var(--teal);color:var(--teal);}
.cta-ghost:hover{background:var(--teal);color:#fff;}

/* RESULTS */
.results{display:none;}.results.show{display:block;}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.kpi-box{border-radius:12px;padding:20px;text-align:center;}
.kpi-box.ink{background:var(--ink);}.kpi-box.teal{background:var(--teal);}
.kpi-box.gold{background:var(--gold);}.kpi-box.rust{background:var(--rust);}
.kpi-lbl{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:6px;}
.kpi-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:#fff;line-height:1;}
.kpi-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:4px;}

/* AMORTISATION TABLE */
.amort-wrap{overflow-x:auto;margin-top:4px;}
.amort-table{width:100%;border-collapse:collapse;font-size:12px;}
.amort-table th{background:var(--ink);color:#fff;padding:10px 12px;text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;}
.amort-table th:first-child{text-align:left;}
.amort-table td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums;}
.amort-table td:first-child{text-align:left;font-weight:600;color:var(--teal);}
.amort-table tr:nth-child(even) td{background:var(--mist);}
.amort-table tr:last-child td{border-bottom:none;font-weight:700;}

/* VERDICT */
.verdict{border-radius:12px;padding:22px 24px;margin-top:20px;}
.verdict.strong{background:var(--ink);}.verdict.ok{background:var(--teal);}.verdict.weak{background:var(--rust);}
.verdict h3{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:#fff;margin-bottom:8px;}
.verdict p{font-size:13px;color:rgba(255,255,255,.8);line-height:1.7;}

/* STRUCTURE VISUAL */
.struct-visual{display:flex;gap:0;margin:16px 0;border-radius:10px;overflow:hidden;height:48px;}
.sv-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;transition:width .6s;}
.sv-label{white-space:nowrap;padding:0 10px;}

/* PRINT */
@media print{.cta,.cta-ghost{display:none;}}
</style>
</head>
<body>
<div class="masthead">
  <div class="mc-badge"><div class="tool-num">1</div><span>Profitable Equipment Leasing Masterclass</span></div>
  <h1>Lease Deal <em>Structure Builder</em></h1>
  <div class="masthead-sub">Enter your deal parameters — get a full structure with amortisation, IRR, and a go / no-go verdict in 30 seconds</div>
</div>

<div class="main">
  <!-- INPUTS -->
  <div class="card">
    <div class="card-title">Deal Parameters</div>
    <div class="g3">
      <div class="field"><label>Asset Cost (KES)</label><input type="number" id="cost" value="5800000" oninput="live()"></div>
      <div class="field"><label>Lease Term (Months)</label>
        <select id="term" onchange="live()">
          <option value="24">24 months</option><option value="36">36 months</option>
          <option value="48" selected>48 months</option><option value="60">60 months</option>
        </select>
      </div>
      <div class="field"><label>Implicit Rate (% p.a.)</label><input type="number" id="rate" value="18" step="0.5" oninput="live()"></div>
    </div>
    <div class="g3">
      <div class="field"><label>Product Type</label>
        <select id="product" onchange="live()">
          <option>Finance Lease — Full Payout</option>
          <option>Operating Lease</option>
          <option>Hire Purchase</option>
          <option>Sale and Leaseback</option>
        </select>
      </div>
      <div class="field"><label>Residual / Purchase Option (KES)</label><input type="number" id="residual" value="100" oninput="live()"></div>
      <div class="field"><label>Advance Rentals (#)</label>
        <select id="advance" onchange="live()">
          <option value="0">0 — no advance</option><option value="1">1 advance rental</option>
          <option value="2" selected>2 advance rentals</option><option value="3">3 advance rentals</option>
        </select>
      </div>
    </div>
    <div class="g3">
      <div class="field"><label>Your Cost of Funds (% p.a.)</label><input type="number" id="cof" value="15" step="0.5" oninput="live()"></div>
      <div class="field"><label>Client Name (optional)</label><input type="text" id="client" placeholder="e.g. Nakuru Harvest Co"></div>
      <div class="field"><label>Asset Description</label><input type="text" id="asset" placeholder="e.g. Isuzu NQR truck"></div>
    </div>
  </div>

  <!-- LIVE PREVIEW -->
  <div class="card">
    <div class="card-title">Live Preview</div>
    <div class="g4">
      <div class="field"><label>Monthly Rental</label><div class="computed" id="lv_rental">—</div></div>
      <div class="field"><label>Annual Rental</label><div class="computed" id="lv_annual">—</div></div>
      <div class="field"><label>Total Rentals</label><div class="computed" id="lv_total">—</div></div>
      <div class="field"><label>Gross Income</label><div class="computed" id="lv_income">—</div></div>
    </div>
    <div class="g4">
      <div class="field"><label>Implicit Rate (IRR)</label><div class="computed" id="lv_irr">—</div></div>
      <div class="field"><label>Net Interest Spread</label><div class="computed" id="lv_spread">—</div></div>
      <div class="field"><label>Advance Rental (upfront)</label><div class="computed" id="lv_advance">—</div></div>
      <div class="field"><label>Structure Verdict</label><div class="computed" id="lv_verdict">—</div></div>
    </div>
    <!-- STRUCTURE BAR -->
    <div style="font-size:11px;font-weight:600;color:var(--mid);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;">Deal Economics Breakdown</div>
    <div class="struct-visual" id="structBar"></div>
    <div style="display:flex;gap:20px;margin-top:8px;flex-wrap:wrap;" id="structLegend"></div>
  </div>

  <div style="display:flex;gap:12px;margin-bottom:24px;">
    <button class="cta" onclick="buildFull()">Build Full Structure →</button>
    <button class="cta cta-ghost" onclick="window.print()">🖨 Print</button>
  </div>

  <!-- FULL RESULTS -->
  <div class="results" id="results">
    <div class="kpi-strip" id="kpis"></div>

    <div class="card">
      <div class="card-title">Year-by-Year Amortisation</div>
      <div class="amort-wrap"><table class="amort-table" id="amortTable"></table></div>
    </div>

    <div id="verdictBox"></div>
  </div>
</div>

<script>
const fmt=(n,d=0)=>isNaN(n)?'—':'KES '+n.toLocaleString('en-KE',{maximumFractionDigits:d,minimumFractionDigits:d});
const fmtP=n=>isNaN(n)||!isFinite(n)?'—':n.toFixed(2)+'%';
function v(id){return parseFloat(document.getElementById(id)?.value)||0;}
function el(id){return document.getElementById(id);}
function set(id,val,cls=''){const e=el(id);if(!e)return;e.textContent=val;e.className='computed'+(cls?' '+cls:'');}

let mr=0,ar=0;

function calcRental(){
  const cost=v('cost'),term=parseInt(el('term').value)||48,rate=v('rate'),res=v('residual');
  if(!cost||!rate)return 0;
  const r=rate/12/100;
  const af=res>0
    ?(1-Math.pow(1+r,-(term-1)))/r  // simplified — full calc below
    :(1-Math.pow(1+r,-term))/r;
  // Correct calc with residual
  const rental=cost>0?(cost - res*Math.pow(1+r,-term))/((1-Math.pow(1+r,-term))/r):0;
  return rental;
}

function live(){
  const cost=v('cost'),term=parseInt(el('term').value)||48,rate=v('rate');
  const cof=v('cof'),adv=parseInt(el('advance').value)||0,res=v('residual');
  if(!cost||!rate){return;}
  const r=rate/12/100;
  mr=cost>0?(cost - res*Math.pow(1+r,-term))/((1-Math.pow(1+r,-term))/r):0;
  ar=mr*12;
  const total=mr*term+res;
  const income=total-cost;
  const spread=rate-cof;
  const advAmt=mr*adv;

  set('lv_rental',fmt(mr));
  set('lv_annual',fmt(ar));
  set('lv_total',fmt(total));
  set('lv_income',fmt(income),income>0?'good':'bad');
  set('lv_irr',fmtP(rate),rate>=18?'good':rate>=14?'warn':'bad');
  set('lv_spread',fmtP(spread),spread>=4?'good':spread>=2?'warn':'bad');
  set('lv_advance',fmt(advAmt));

  const ok=spread>=3&&rate>=14;
  set('lv_verdict',ok?'✓ Viable structure':'⚠ Review rate or cost of funds',ok?'good':'warn');

  // Structure bar
  const capPct=cost/total*100;
  const incPct=income/total*100;
  const resPct=res/total*100;
  el('structBar').innerHTML=`
    <div class="sv-seg" style="width:${capPct}%;background:var(--teal);"><span class="sv-label">Capital ${capPct.toFixed(0)}%</span></div>
    <div class="sv-seg" style="width:${incPct}%;background:var(--gold);"><span class="sv-label">Income ${incPct.toFixed(0)}%</span></div>
    <div class="sv-seg" style="width:${resPct}%;background:var(--rust);"><span class="sv-label">${resPct>2?'RV '+resPct.toFixed(0)+'%':''}</span></div>`;
  el('structLegend').innerHTML=`
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;"><span style="width:10px;height:10px;border-radius:2px;background:var(--teal);display:inline-block;"></span>Capital Recovery ${fmt(cost)}</div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;"><span style="width:10px;height:10px;border-radius:2px;background:var(--gold);display:inline-block;"></span>Gross Income ${fmt(income)}</div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;"><span style="width:10px;height:10px;border-radius:2px;background:var(--rust);display:inline-block;"></span>Residual ${fmt(res)}</div>`;
}

function buildFull(){
  live();
  const cost=v('cost'),term=parseInt(el('term').value)||48,rate=v('rate');
  const cof=v('cof'),res=v('residual');
  const r=rate/12/100;

  // Amortisation
  let bal=cost;
  const rows=[],yearly={};
  for(let m=1;m<=term;m++){
    const interest=bal*r;
    const principal=mr-interest;
    bal=Math.max(0,bal-principal);
    const yr=Math.ceil(m/12);
    if(!yearly[yr]) yearly[yr]={int:0,prin:0,rental:0,openBal:0};
    if(m%12===1||(m===1)) yearly[yr].openBal=cost-0;
    yearly[yr].int+=interest;
    yearly[yr].prin+=principal;
    yearly[yr].rental+=mr;
  }
  // Recalc open balance by year
  let runBal=cost;
  const yrows=Object.keys(yearly).map(yr=>{
    const d=yearly[yr];
    const ob=runBal;
    runBal-=d.prin;
    return {yr,ob,int:d.int,prin:d.prin,rental:d.rental,cb:Math.max(0,runBal)};
  });

  const totalInt=yrows.reduce((s,r)=>s+r.int,0);
  const totalPrin=yrows.reduce((s,r)=>s+r.prin,0);
  const totalRental=yrows.reduce((s,r)=>s+r.rental,0);

  el('amortTable').innerHTML=`
    <thead><tr>
      <th style="text-align:left">Year</th>
      <th>Opening Balance</th>
      <th>Annual Rental</th>
      <th>Finance Charge</th>
      <th>Capital Repaid</th>
      <th>Closing Balance</th>
    </tr></thead>
    <tbody>
      ${yrows.map(row=>`<tr>
        <td>Year ${row.yr}</td>
        <td>${fmt(row.ob)}</td>
        <td>${fmt(row.rental)}</td>
        <td>${fmt(row.int)}</td>
        <td>${fmt(row.prin)}</td>
        <td>${fmt(row.cb)}</td>
      </tr>`).join('')}
      <tr style="background:var(--mist);">
        <td><strong>TOTAL</strong></td>
        <td>—</td>
        <td><strong>${fmt(totalRental)}</strong></td>
        <td><strong>${fmt(totalInt)}</strong></td>
        <td><strong>${fmt(totalPrin)}</strong></td>
        <td>—</td>
      </tr>
    </tbody>`;

  // KPIs
  const spread=rate-cof;
  const client=el('client').value||'Client';
  const asset=el('asset').value||'Asset';
  el('kpis').innerHTML=`
    <div class="kpi-box ink"><div class="kpi-lbl">Monthly Rental</div><div class="kpi-val">${fmt(mr)}</div><div class="kpi-sub">${term} months</div></div>
    <div class="kpi-box teal"><div class="kpi-lbl">Gross Income</div><div class="kpi-val">${fmt(totalInt+res)}</div><div class="kpi-sub">Over full term</div></div>
    <div class="kpi-box gold"><div class="kpi-lbl">Implicit Rate</div><div class="kpi-val">${fmtP(rate)}</div><div class="kpi-sub">vs CoF ${fmtP(cof)}</div></div>
    <div class="kpi-box rust"><div class="kpi-lbl">NI Spread</div><div class="kpi-val">${fmtP(spread)}</div><div class="kpi-sub">${spread>=4?'Strong ✓':spread>=2?'Acceptable':'⚠ Review'}</div></div>`;

  // Verdict
  const strong=spread>=4&&rate>=18;
  const ok=spread>=2&&rate>=14;
  const vClass=strong?'strong':ok?'ok':'weak';
  const vTitle=strong?'Strong deal structure':'Deal viable — watch the margin':'⚠ Margin at risk — restructure before signing';
  const vMsg=strong
    ?`${client} — ${asset} at ${fmt(mr)}/month. Spread of ${fmtP(spread)} over your ${fmtP(cof)} cost of funds is strong. Gross income over term: ${fmt(totalInt+res)}. Proceed with confidence.`
    :ok
    ?`Deal is viable but margin is tight at ${fmtP(spread)} spread. Consider increasing the implicit rate by 100–150 bps, reducing the term, or requiring 2 advance rentals to improve opening cashflow.`
    :`Net interest spread of ${fmtP(spread)} does not adequately cover operational costs and credit loss provision. At ${fmtP(cof)} cost of funds you need at least a ${fmtP(cof+5)}% implicit rate to build a sustainable margin. Reprice before proceeding.`;
  el('verdictBox').innerHTML=`<div class="verdict ${vClass}"><h3>${vTitle}</h3><p>${vMsg}</p></div>`;

  el('results').classList.add('show');
  el('results').scrollIntoView({behavior:'smooth',block:'start'});
}

live();
</script>
</body>
</html>
